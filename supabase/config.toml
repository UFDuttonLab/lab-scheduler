# Password reset is now handled entirely by Supabase Auth over custom SMTP (Brevo).
# The three functions that used to implement it by hand - request-password-reset,
# send-password-reset (a Send Email Hook) and update-password - are gone. Supabase
# generates, expires and single-uses the recovery token itself, and the client picks the
# recovery session up via PASSWORD_RECOVERY (see src/pages/ResetPasswordVerify.tsx:20-26).
#
# CORRECTION 2026-08-09: an earlier version of this comment also claimed the
# password_reset_tokens table was dropped. It was not - the table is still live with 44
# rows, all of them used or expired (newest 2026-05-14). It is orphaned but harmless:
# nothing in src/ reads it, manage-users does not touch it, and a dependency check found
# no views, functions, triggers or foreign keys referencing it. It is being left in place
# deliberately rather than dropped, because dropping it gains nothing and the old edge
# functions may still be deployed server-side even though their source is gone from here.
#
# manage-users is NOT listed here on purpose: without an entry it inherits verify_jwt = true,
# so the gateway validates the caller's JWT signature before the function runs.
