name: Deploy to GitHub Pages

# This replaced a workflow that built the site and COMMITTED it back to main as docs/.
# That version worked, and it was the wrong design: it made main have two authors. On
# 2026-08-22 it pushed "Rebuild docs/ from b72e819" 42 seconds after a human push, which
# moved origin/main underneath the work in progress and forced a merge commit
# (41b2ccf) on the next push. Worse, a build produced by hand elsewhere and a build
# produced here never hash the same - different Node versions - so docs/ changed on every
# single run and the churn was guaranteed rather than occasional.
#
# One artifact, one producer. This workflow publishes the build straight to Pages and
# commits nothing, so the only thing that ever writes to main is a person.
#
# ────────────────────────────────────────────────────────────────────────────────────
# THIS REQUIRES A ONE-TIME SETTING: Settings → Pages → Source must be "GitHub Actions".
# While it is still "Deploy from a branch", the deploy step below fails - that is the
# expected single red X on the run that introduces this file. Flip the setting, then
# re-run from Actions → Deploy to GitHub Pages → Run workflow.
# ────────────────────────────────────────────────────────────────────────────────────
#
# docs/ is now dead weight. It can be deleted from the repo whenever convenient; nothing
# reads it once the Pages source has changed. Leaving it does no harm beyond noise in
# diffs.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'        # only relevant until docs/ is deleted
  workflow_dispatch:

permissions:
  contents: read         # no write: this workflow must never push
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it - a half-cancelled deploy can
# leave Pages serving the previous build with no clear signal why.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # npm ci, not npm install, so a deploy uses exactly the versions in
      # package-lock.json and a transitive dependency cannot drift under it.
      - name: Install
        run: npm ci

      # .env is tracked and holds only the public Supabase URL, the publishable key and
      # the Turnstile SITE key - all three are compiled into the bundle every visitor
      # downloads anyway. Nothing secret is read here, and nothing secret may ever be
      # given a VITE_ prefix.
      - name: Build
        run: npm run build

      # vite.config.ts sets base: "/lab-scheduler/", which is still correct: a project
      # repo is served from that path whether Pages reads a branch or an artifact.
      #
      # 404.html must be a byte-identical copy of index.html. It is the SPA fallback Pages
      # serves for any path it does not recognise, and the app uses HashRouter, so a deep
      # link that arrives without the hash still has to boot the app.
      - name: Add the SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
