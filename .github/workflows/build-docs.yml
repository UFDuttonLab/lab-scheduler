name: Build docs/

# Why this exists
# ---------------
# GitHub Pages serves this repo from the committed docs/ folder, not from a build step.
# That means pushing source does NOT deploy: until 2026-08-22 somebody had to run
# `npm run build` and copy four files into docs/ by hand, and on 2026-08-09 that was
# forgotten - the Skills module was live in source and absent from the site for days,
# while the user hunted for a menu item that had never been deployed.
#
# This workflow does that copy on every push to main.
#
# Deliberately NOT actions/deploy-pages
# -------------------------------------
# The official Pages action needs Settings -> Pages -> Source set to "GitHub Actions".
# This repo is set to "Deploy from a branch", and until that is changed every run of a
# deploy-pages workflow would fail and put a red X on the commit. Committing docs/ back to
# the branch works with the Pages settings exactly as they are, so nothing needs changing
# for this to start working.
#
# If you ever do switch Pages to "GitHub Actions", replace this file rather than adding a
# second workflow - two things writing the same output is worse than either alone.

on:
  push:
    branches: [main]
    # Without this the workflow's own commit to docs/ would trigger another run, which
    # would build the same output, find nothing to commit, and stop - harmless but noisy.
    # Ignoring the path stops the second run from ever starting.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only in many orgs; this asks for the write it needs to
# push the rebuilt docs/ back to main.
permissions:
  contents: write

concurrency:
  # One build at a time. Two runs racing to commit docs/ would conflict on push.
  group: build-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` rather than `npm install`, so the build uses exactly the versions in
      # package-lock.json and a dependency cannot drift underneath a deploy.
      - name: Install
        run: npm ci

      # .env is tracked in this repo and holds only the public Supabase URL, the
      # publishable key and the Turnstile SITE key - all three are compiled into the
      # bundle every visitor downloads anyway. Nothing secret is read here, and nothing
      # secret must ever be added to a VITE_ variable.
      - name: Build
        run: npm run build

      # vite.config.ts sets base: "/lab-scheduler/" but does not override outDir, so the
      # build lands in dist/. The copy into docs/ is what this workflow exists to do.
      #
      # Old hashed assets are NOT pruned. That matches the existing practice in this repo
      # and it is deliberate: a visitor holding a half-loaded page still resolves the
      # bundle it asked for.
      - name: Copy the build into docs/
        run: |
          mkdir -p docs/assets
          cp dist/index.html docs/index.html
          cp -r dist/assets/. docs/assets/
          if [ -d dist ]; then
            find dist -maxdepth 1 -type f ! -name index.html -exec cp {} docs/ \;
          fi
          # docs/404.html must be a byte-identical copy of index.html. It is the SPA
          # fallback Pages serves for any path it does not recognise; if it is stale, a
          # deep link quietly serves the previous build.
          cp docs/index.html docs/404.html
          # Without .nojekyll, Pages runs the output through Jekyll, which ignores files
          # and folders beginning with an underscore.
          touch docs/.nojekyll

      - name: Commit docs/ if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs/ is already up to date with this commit - nothing to do."
            exit 0
          fi
          git commit -m "Rebuild docs/ from ${GITHUB_SHA::7} [skip ci]"
          git push
